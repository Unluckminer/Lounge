name: Lounge bauen und veröffentlichen

# Neue Version veröffentlichen: auf GitHub ein Release mit Tag wie v1.5.0 anlegen (oder: git tag v1.5.0 && git push --tags).
# Der Workflow baut dann Windows, macOS und Linux, hängt alles ans Release und die installierten Apps aktualisieren sich selbst.
# Von Hand starten (Actions > Run workflow) baut nur zum Testen, ohne zu veröffentlichen.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact_name: dist-win
          - os: macos-latest
            script: dist:mac
            artifact_name: dist-mac
          - os: ubuntu-latest
            script: dist:linux
            artifact_name: dist-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repository eintragen und Version aus dem Tag übernehmen
        shell: bash
        run: |
          npm pkg set repository="github:${{ github.repository }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version; fi
      - run: npm install
      - run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/Lounge-*
            dist/latest*.yml
