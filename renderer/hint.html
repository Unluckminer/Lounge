<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent;color:#fff;font:500 16px/1.3 "Segoe UI Variable Text","Segoe UI",system-ui,"Noto Sans",sans-serif}
.p{margin:6px;height:calc(100% - 12px);box-sizing:border-box;border-radius:30px;background:rgba(26,27,33,.95);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 1px rgba(255,255,255,.25);
 display:flex;align-items:center;gap:20px;padding:0 28px;animation:io 7.5s both}
.keys{display:flex;gap:8px}
kbd{min-width:52px;height:44px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(#4a4c58,#32343e);border-bottom:3px solid #1b1c22;font:600 16px "Segoe UI",sans-serif;padding:0 10px}
b{display:block;font-size:18px;font-weight:600}
small{display:block;opacity:.62;font-size:14px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:400px}
@keyframes io{0%{opacity:0;transform:translateY(-14px)}6%{opacity:1;transform:none}92%{opacity:1}100%{opacity:0}}
</style></head>
<body><div class="p">
<div class="keys" id="keys"><kbd>Esc</kbd><kbd>Esc</kbd></div>
<div><b id="t"></b><small id="s"></small></div>
</div>
<script src="i18n.js"></script>
<script>
const q = new URLSearchParams(location.search), on = q.get('e') === '1', l = q.get('l') || 'en';
document.documentElement.dir = I18N.dir(l);
document.getElementById('t').textContent = I18N.t(l, on ? 'hClose' : 'hBack');
document.getElementById('s').textContent = (q.get('n') || '') + (on ? ' – ' + I18N.t(l, 'hOr') : '');
if (!on) document.getElementById('keys').hidden = true;
</script></body></html>
